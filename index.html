<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vexdar</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/static/icon-192.png">
<meta name="theme-color" content="#080413">
<style>
  :root { --bg:#080413; --panel:#150b27; --garis:#2a1b47; --teks:#f2ecff; --redup:#9a8bbd; --aksen:#ff8a2a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--teks); font-family: system-ui, sans-serif;
         display: flex; flex-direction: column; max-width: 760px; margin: 0 auto;
         padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--garis); }
  header img { width: 36px; height: 36px; border-radius: 50%; }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  button { background: var(--aksen); color: #1a0b00; border: 0; border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 15px; }
  button:disabled { opacity: .5; }
  button.sekunder { background: var(--panel); color: var(--teks); border: 1px solid var(--garis); }
  button.kecil { padding: 6px 10px; font-size: 13px; }
  #log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .pesan { max-width: 88%; padding: 10px 13px; border-radius: 14px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
  .kamu { align-self: flex-end; background: #3a1d6e; }
  .vexdar { align-self: flex-start; background: var(--panel); border: 1px solid var(--garis); }
  .sistem { align-self: center; color: var(--redup); font-size: 13px; text-align: center; }
  .lampiran { align-self: flex-start; display: flex; flex-wrap: wrap; gap: 6px; }
  #berkas { display: none; padding: 10px 14px; border-top: 1px solid var(--garis); background: var(--panel); max-height: 42vh; overflow-y: auto; }
  #berkas .info { color: var(--redup); font-size: 12px; margin: 6px 0 8px; }
  .item { padding: 8px 0; border-top: 1px solid var(--garis); }
  .item .nama { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .meta { color: var(--redup); font-size: 12px; margin-bottom: 6px; }
  .aksi { display: flex; flex-wrap: wrap; gap: 6px; }
  form { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--garis); }
  input[type=text] { flex: 1; min-width: 0; background: var(--panel); color: var(--teks); border: 1px solid var(--garis);
                     border-radius: 10px; padding: 11px 12px; font-size: 16px; }
  input[type=file] { display: none; }
  dialog { background: var(--panel); color: var(--teks); border: 1px solid var(--garis); border-radius: 14px;
           width: min(94vw, 720px); max-height: 86vh; padding: 0; }
  dialog::backdrop { background: rgba(0,0,0,.7); }
  .dl-kepala { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--garis); }
  .dl-kepala b { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #isiLihat { padding: 12px 14px; overflow: auto; max-height: calc(86vh - 56px); }
  #isiLihat pre { margin: 0; white-space: pre-wrap; word-wrap: break-word; font-family: ui-monospace, monospace; font-size: 13px; line-height: 1.45; }
  #isiLihat img { max-width: 100%; border-radius: 8px; }
</style>
</head>
<body>
<header>
  <img src="/static/icon-192.png" alt="">
  <h1>Vexdar</h1>
  <button class="sekunder" id="btnBerkas" type="button">File</button>
</header>

<div id="log"></div>

<div id="berkas">
  <div class="aksi">
    <button type="button" id="btnPilih">Kirim file ke Vexdar</button>
    <button type="button" class="sekunder" id="btnRefresh">Muat ulang</button>
  </div>
  <div class="info">File yang dibaca AI dikirim ke penyedia model. Jangan unggah dokumen rahasia atau data pribadi.</div>
  <div id="daftar"></div>
</div>

<form id="form">
  <button type="button" class="sekunder" id="btnLampir" aria-label="Lampirkan file">Lampir</button>
  <input type="text" id="q" placeholder="Ketik pesan atau perintah…" autocomplete="off">
  <button type="submit" id="btnKirim">Kirim</button>
</form>
<input type="file" id="pilih" multiple>

<dialog id="dlg">
  <div class="dl-kepala"><b id="judulLihat"></b><button type="button" class="sekunder kecil" id="tutupLihat">Tutup</button></div>
  <div id="isiLihat"></div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
let TOKEN = localStorage.getItem("vexdar_token") || "";
const riwayat = [];
const adaShare = typeof navigator.canShare === "function";

function mintaToken() {
  const t = prompt("Masukkan token Vexdar:");
  TOKEN = (t || "").trim();
  localStorage.setItem("vexdar_token", TOKEN);
}

async function api(path, opsi = {}) {
  if (!TOKEN) mintaToken();
  const res = await fetch(path, {
    ...opsi,
    headers: { ...(opsi.headers || {}), Authorization: "Bearer " + TOKEN },
  });
  if (res.status === 401) {
    localStorage.removeItem("vexdar_token");
    TOKEN = "";
    throw new Error("Token salah. Muat ulang halaman lalu masukkan token yang benar.");
  }
  return res;
}

function ukuran(b) {
  if (b < 1024) return b + " B";
  if (b < 1048576) return (b / 1024).toFixed(1) + " KB";
  return (b / 1048576).toFixed(1) + " MB";
}
function waktu(t) {
  return new Date(t * 1000).toLocaleString("id-ID", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}

function tampil(kelas, teks) {
  const d = document.createElement("div");
  d.className = "pesan " + kelas;
  d.textContent = teks;
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
  return d;
}

function tombol(label, fn, kelas = "sekunder kecil") {
  const b = document.createElement("button");
  b.type = "button";
  b.className = kelas;
  b.textContent = label;
  b.onclick = fn;
  return b;
}

// ----- Chat -----
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const teks = $("q").value.trim();
  if (!teks) return;
  $("q").value = "";
  tampil("kamu", teks);
  riwayat.push({ role: "user", content: teks });
  const tunggu = tampil("sistem", "Vexdar sedang mengetik…");
  $("btnKirim").disabled = true;
  try {
    const res = await api("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: riwayat }),
    });
    const data = await res.json();
    tunggu.remove();
    if (data.error) {
      tampil("sistem", "⚠ " + data.error);
      riwayat.pop();
    } else {
      riwayat.push({ role: "assistant", content: data.reply });
      tampil("vexdar", data.reply);
      if (data.files && data.files.length) {
        const kotak = document.createElement("div");
        kotak.className = "lampiran";
        data.files.forEach((n) => {
          kotak.appendChild(tombol("Unduh " + n, () => unduh(n), "kecil"));
          kotak.appendChild(tombol("Lihat", () => lihat(n)));
        });
        $("log").appendChild(kotak);
        $("log").scrollTop = $("log").scrollHeight;
        if ($("berkas").style.display === "block") muatDaftar();
      }
    }
  } catch (err) {
    tunggu.remove();
    tampil("sistem", "⚠ " + err.message);
    riwayat.pop();
  } finally {
    $("btnKirim").disabled = false;
    $("q").focus();
  }
});

// ----- Panel file -----
$("btnBerkas").addEventListener("click", () => {
  const p = $("berkas");
  p.style.display = p.style.display === "block" ? "none" : "block";
  if (p.style.display === "block") muatDaftar();
});
$("btnRefresh").addEventListener("click", muatDaftar);
$("btnPilih").addEventListener("click", () => $("pilih").click());
$("btnLampir").addEventListener("click", () => $("pilih").click());

$("pilih").addEventListener("change", async () => {
  const daftar = Array.from($("pilih").files);
  $("pilih").value = "";
  if (!daftar.length) return;
  const tersimpan = [];
  for (const f of daftar) {
    const info = tampil("sistem", "Mengunggah " + f.name + " (" + ukuran(f.size) + ")…");
    try {
      const fd = new FormData();
      fd.append("file", f);
      const res = await api("/upload", { method: "POST", body: fd });
      const d = await res.json();
      info.remove();
      if (d.error) tampil("sistem", "⚠ " + d.error);
      else { tersimpan.push(...d.saved); tampil("sistem", "Tersimpan: " + d.saved.join(", ")); }
    } catch (err) {
      info.remove();
      tampil("sistem", "⚠ " + f.name + ": " + err.message);
    }
  }
  if (tersimpan.length) {
    if (!$("q").value) $("q").value = "Baca file " + tersimpan[0] + " dan ringkas isinya";
    if ($("berkas").style.display === "block") muatDaftar();
  }
});

async function muatDaftar() {
  const kotak = $("daftar");
  kotak.textContent = "Memuat…";
  try {
    const res = await api("/files");
    const data = await res.json();
    kotak.textContent = "";
    if (!Array.isArray(data) || data.length === 0) {
      kotak.textContent = "Belum ada file.";
      return;
    }
    data.forEach((f) => {
      const item = document.createElement("div");
      item.className = "item";
      const nama = document.createElement("div");
      nama.className = "nama";
      nama.textContent = f.name;
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = ukuran(f.size) + " · " + waktu(f.mtime);
      const aksi = document.createElement("div");
      aksi.className = "aksi";
      aksi.append(
        tombol("Lihat", () => lihat(f.name)),
        tombol("Tanya AI", () => { $("q").value = "Baca file " + f.name + " dan ringkas isinya"; $("berkas").style.display = "none"; $("q").focus(); }),
        tombol("Unduh", () => unduh(f.name)),
      );
      if (adaShare) aksi.append(tombol("Bagikan", () => bagikan(f.name)));
      aksi.append(tombol("Hapus", () => hapus(f.name)));
      item.append(nama, meta, aksi);
      kotak.appendChild(item);
    });
  } catch (err) {
    kotak.textContent = err.message;
  }
}

async function ambilBlob(nama) {
  const res = await api("/download/" + encodeURIComponent(nama));
  if (!res.ok) throw new Error("Gagal mengambil file.");
  return await res.blob();
}

async function unduh(nama) {
  try {
    const url = URL.createObjectURL(await ambilBlob(nama));
    const a = document.createElement("a");
    a.href = url; a.download = nama;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  } catch (err) {
    tampil("sistem", "⚠ " + err.message);
  }
}

async function bagikan(nama) {
  try {
    const blob = await ambilBlob(nama);
    const berkas = new File([blob], nama, { type: blob.type });
    if (navigator.canShare({ files: [berkas] })) await navigator.share({ files: [berkas], title: nama });
    else tampil("sistem", "Jenis file ini tidak bisa dibagikan dari browser. Gunakan Unduh.");
  } catch (err) {
    if (err.name !== "AbortError") tampil("sistem", "⚠ " + err.message);
  }
}

async function hapus(nama) {
  if (!confirm("Hapus " + nama + "?")) return;
  try {
    const res = await api("/files/" + encodeURIComponent(nama), { method: "DELETE" });
    const d = await res.json();
    if (d.error) tampil("sistem", "⚠ " + d.error);
    muatDaftar();
  } catch (err) {
    tampil("sistem", "⚠ " + err.message);
  }
}

// ----- Penampil file -----
let urlGambar = null;
$("tutupLihat").addEventListener("click", () => $("dlg").close());
$("dlg").addEventListener("close", () => {
  if (urlGambar) { URL.revokeObjectURL(urlGambar); urlGambar = null; }
  $("isiLihat").textContent = "";
});

async function lihat(nama) {
  const isi = $("isiLihat");
  isi.textContent = "Memuat…";
  $("judulLihat").textContent = nama;
  if (!$("dlg").open) $("dlg").showModal();
  const ext = nama.split(".").pop().toLowerCase();
  try {
    if (["png", "jpg", "jpeg"].includes(ext)) {
      urlGambar = URL.createObjectURL(await ambilBlob(nama));
      const img = document.createElement("img");
      img.src = urlGambar;
      img.alt = nama;
      isi.textContent = "";
      isi.appendChild(img);
    } else {
      const res = await api("/preview/" + encodeURIComponent(nama));
      const d = await res.json();
      const pre = document.createElement("pre");
      pre.textContent = d.error ? "⚠ " + d.error
        : (d.text || "(file kosong)") + (d.terpotong ? "\n\n[… dipotong. Unduh untuk file lengkap.]" : "");
      isi.textContent = "";
      isi.appendChild(pre);
    }
  } catch (err) {
    isi.textContent = "⚠ " + err.message;
  }
}

tampil("sistem", "Halo, saya Vexdar. Ketik pesan, atau tekan Lampir untuk mengirim file dari HP.");
</script>
</body>
</html>
